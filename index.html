<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Información | Panel de Operaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botón Flotante para abrir Menú de Despedidas -->
    <button id="btnMenuDespedidas" class="theme-btn" style="position:fixed; left: 30px; bottom: 30px; z-index: 99; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" title="Menú de Despedidas">👋</button>

    <!-- Menú Lateral Oculto -->
    <div id="sideMenuDespedidas" class="side-menu">
        <div class="menu-header">
            <h3>Cierre de Chat</h3>
            <button id="closeMenuBtn" class="close-menu-btn" title="Cerrar menú">&times;</button>
        </div>
        
        <div class="menu-content">
            <!-- Selector de Estado -->
            <div class="toggle-container">
                <label class="toggle-label">
                    <input type="radio" name="estadoDespedida" value="activo" checked> Activo
                </label>
                <label class="toggle-label">
                    <input type="radio" name="estadoDespedida" value="inactivo"> Inactivo
                </label>
            </div>

            <!-- Buscador interno -->
            <div class="search-box-menu">
                <input type="text" id="searchHashtag" placeholder="🔍 Buscar etiqueta...">
            </div>

            <!-- Contenedor dinámico de botones -->
            <div id="hashtagButtonsContainer" class="hashtag-container">
                <!-- Se llenará con JavaScript -->
            </div>
        </div>
    </div>

    <div class="container">
        <header>

            <div class="header-titles">
                <h1>Gestor de Respuestas</h1>
                <p class="subtitle">LOCATEL</p>
                <a href="WhatsApp/WhatsApp.html" class="whatsapp-nav-btn">WhatsApp</a>
            </div>

            <div class="timer-card">
                <div class="timer-inputs">
                    <label>Minutos:</label>
                    <input type="number" id="inputTimer" value="25" min="1" placeholder="Ej. 25">
                </div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button id="btnPlayTimer" class="timer-btn play" title="Iniciar">▶</button>
                    <button id="btnPauseTimer" class="timer-btn pause" title="Pausar y Registrar">⏸</button>
                    <button id="btnResetTimer" class="timer-btn reset" title="Reiniciar">🔄</button>
                </div>
            </div>
            
            <!-- CONTENEDOR DE PESTAÑAS -->
            <div class="tabs-container" id="tabsContainer">
                <!-- Los botones se generarán con JavaScript -->
            </div>

            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Buscar en la pestaña actual...">
                <!-- botón de limpiar -->
                <button id="clearSearch" class="clear-btn" title="Limpiar búsqueda">&times;</button>
            </div>
        </header>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Tema</th>
                        <th>Subtema</th>
                        <th>Categoría</th>
                        <th>Texto de Respuesta</th>
                        <th>Hashtag</th>
                        <th class="center-col">Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="loading">
                            <div class="loader"></div>
                            Selecciona una pestaña para cargar la base de datos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
